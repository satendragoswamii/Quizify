{# Student portal login — separate from the admin login. No password reset / Google. #}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Login &middot; {{ app_name }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
    :root{--primary:#3358D4;--primary-dark:#2544AE;--accent:#6E7BF2;--ink:#10162a;--muted:#6b7280;--border:#e3e8f2;}
    body{font-family:'Inter',system-ui,sans-serif;color:var(--ink);min-height:100vh;display:grid;place-items:center;padding:24px;
      background:radial-gradient(120% 80% at 100% 0%,#eef2fe 0%,transparent 52%),radial-gradient(90% 70% at 0% 100%,#f0edff 0%,transparent 48%),#f6f8fe;}
    .card{width:min(420px,100%);background:#fff;border:1px solid var(--border);border-radius:22px;padding:40px 36px;box-shadow:0 24px 56px rgba(20,30,80,.12);}
    .brand{display:flex;align-items:center;gap:11px;font-weight:800;font-size:22px;justify-content:center;}
    .brand .cap{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(135deg,var(--primary),var(--accent));box-shadow:0 8px 18px rgba(51,88,212,.32);}
    .brand .cap svg{width:22px;height:22px;fill:#fff;}
    .brand span{color:var(--primary);}
    h1{font-size:20px;font-weight:800;text-align:center;margin-top:14px;}
    .sub{text-align:center;color:var(--muted);font-size:14px;margin-top:4px;}
    .tag{display:block;text-align:center;margin-top:10px;font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--primary);text-transform:uppercase;}
    label{display:block;font-size:13px;font-weight:600;margin:16px 0 6px;}
    input{width:100%;height:48px;padding:0 15px;border:1.5px solid var(--border);border-radius:12px;font:inherit;font-size:15px;}
    input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 4px rgba(51,88,212,.12);}
    .btn{width:100%;height:52px;margin-top:22px;border:none;border-radius:13px;cursor:pointer;background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;font-size:16px;font-weight:700;box-shadow:0 12px 26px rgba(51,88,212,.3);}
    .btn:hover{filter:brightness(1.05);}
    .err{margin-top:16px;padding:11px 14px;border-radius:11px;background:#fdecec;border:1px solid #f6c9c4;color:#b23b32;font-size:13.5px;}
    .foot{text-align:center;margin-top:18px;font-size:12.5px;color:var(--muted);}
    .foot a{color:var(--primary);text-decoration:none;}
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <span class="cap"><svg viewBox="0 0 24 24"><path d="M12 3 1 8l11 5 9-4.09V15h2V8L12 3zM5 13.18V17c0 1.66 3.13 3 7 3s7-1.34 7-3v-3.82l-7 3.18-7-3.18z"/></svg></span>
      Quiz<span>ify</span>
    </div>
    <span class="tag">Student portal</span>
    <h1>Sign in to your account</h1>
    <p class="sub">View and take the quizzes assigned to you.</p>

    {% if error %}<div class="err">{{ error }}</div>{% endif %}

    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" value="{{ email }}" placeholder="you@example.com" required autofocus autocomplete="username">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="Your password" required autocomplete="current-password">
      <button type="submit" class="btn">Sign in</button>
    </form>
    <div class="foot">Staff? <a href="{{ url_for('admin.login') }}">Go to the admin panel</a></div>
  </div>
</body>
</html>
